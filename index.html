<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Light Donate</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#0f0f0f;
    color:white;
}

/* фон */
.bg{
    position:absolute;
    width:100%;
    height:100%;
    z-index:-2;
}

.circle{
    position:absolute;
    border-radius:50%;
    filter:blur(90px);
    animation:float 10s infinite alternate;
}

.circle:nth-child(1){
    width:350px;
    height:350px;
    background:#00bfff;
    top:10%;
    left:10%;
}

.circle:nth-child(2){
    width:300px;
    height:300px;
    background:#8a2be2;
    bottom:10%;
    right:10%;
}

.circle:nth-child(3){
    width:250px;
    height:250px;
    background:#ff00ff;
    top:50%;
    left:50%;
}

@keyframes float{
    from{transform:translateY(-20px) translateX(-20px);}
    to{transform:translateY(20px) translateX(20px);}
}

/* карточка */
.card{
    width:360px;
    padding:35px;
    border-radius:25px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(25px);
    border:1px solid rgba(255,255,255,0.1);
    text-align:center;
}

/* аватар */
.avatar{
    width:110px;
    height:110px;
    border-radius:50%;
    margin:0 auto 20px;
    background:url('https://i.imgur.com/2DhmtJ4.png');
    background-size:cover;
    border:3px solid white;
}

h1{margin-bottom:10px;}
p{opacity:0.8; margin-bottom:20px;}

/* кнопка */
a.button{
    display:inline-block;
    padding:14px 35px;
    border-radius:15px;
    background:white;
    color:black;
    text-decoration:none;
    font-weight:bold;
    transition:0.3s;
}

a.button:hover{
    transform:scale(1.05);
}
</style>
</head>

<body>

<div class="bg">
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
</div>

<div class="card">

<div class="avatar"></div>

<h1>Light Donate</h1>
<p>Support me ❤️</p>

<a class="button" href="https://boosty.to/ТВОЙ_НИК" target="_blank">
Donate
</a>

</div>

</body>
</html>
